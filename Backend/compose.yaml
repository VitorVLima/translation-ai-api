services:
  postgres:
    image: 'postgres:18.6'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-mydatabase}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}'
      - 'POSTGRES_USER=${POSTGRES_USER:-myuser}'
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - englishai_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  englishai_postgres_data:
