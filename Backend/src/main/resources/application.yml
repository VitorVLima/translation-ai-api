spring:
  config:
    import: "optional:file:./Backend/.env[.properties],optional:file:./.env[.properties]"

  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}

  application:
    name: english-ai

  servlet:
    multipart:
      max-file-size: ${STT_MAX_FILE_SIZE_MB:20}MB
      max-request-size: ${STT_MAX_REQUEST_SIZE_MB:21}MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${POSTGRES_DB:mydatabase}
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:10000}

ai:
  llm:
    provider: ${LLM_PROVIDER:ollama}
    connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:5}
    response-timeout-seconds: ${LLM_RESPONSE_TIMEOUT_SECONDS:120}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:}
  translation:
    max-characters: ${AI_TRANSLATION_MAX_CHARACTERS:5000}

speech:
  stt:
    provider: ${STT_PROVIDER:whisper}
    connect-timeout-seconds: ${STT_CONNECT_TIMEOUT_SECONDS:5}
    response-timeout-seconds: ${STT_RESPONSE_TIMEOUT_SECONDS:120}
    max-file-size-mb: ${STT_MAX_FILE_SIZE_MB:20}
    whisper:
      base-url: ${WHISPER_BASE_URL:http://127.0.0.1:8001}
  tts:
    provider: ${TTS_PROVIDER:piper}
    connect-timeout-seconds: ${TTS_CONNECT_TIMEOUT_SECONDS:5}
    response-timeout-seconds: ${TTS_RESPONSE_TIMEOUT_SECONDS:60}
    max-text-length: ${TTS_MAX_TEXT_LENGTH:3000}
    max-audio-mb: ${TTS_MAX_AUDIO_MB:20}
    piper:
      base-url: ${PIPER_BASE_URL:http://127.0.0.1:8002}


server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

profile:
  image-storage-dir: ${AVATAR_IMAGE_STORAGE_DIR:./data/profile-images}


security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
    clock-skew-seconds: ${SECURITY_JWT_CLOCK_SKEW_SECONDS:60}
    diagnostics-enabled: ${JWT_DIAGNOSTICS_ENABLED:false}
    issuer: ${SECURITY_JWT_ISSUER:englishai}
    audience: ${SECURITY_JWT_AUDIENCE:englishai-api}

  refresh-token:
    hash-secret: ${SECURITY_REFRESH_TOKEN_HASH_SECRET}
    expiration-seconds: ${SECURITY_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
    family-max-lifetime-seconds: ${SECURITY_REFRESH_TOKEN_FAMILY_MAX_LIFETIME_SECONDS:2592000}

  retention:
    enabled: ${SECURITY_RETENTION_ENABLED:false}
    cleanup-cron: ${SECURITY_RETENTION_CLEANUP_CRON:0 17 3 * * *}
    batch-size: ${SECURITY_RETENTION_BATCH_SIZE:200}
    max-batches-per-table: ${SECURITY_RETENTION_MAX_BATCHES_PER_TABLE:10}
    code-days-after-expiry: ${SECURITY_RETENTION_CODE_DAYS_AFTER_EXPIRY:7}
    family-days-after-expiry: ${SECURITY_RETENTION_FAMILY_DAYS_AFTER_EXPIRY:30}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    clock-skew-seconds: ${SECURITY_GOOGLE_CLOCK_SKEW_SECONDS:60}
