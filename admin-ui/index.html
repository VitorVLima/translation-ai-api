<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnglishAI Admin</title><link rel="stylesheet" href="styles.css"></head><body><main><section id="login-view" class="panel"><h1>EnglishAI Admin</h1><p>Entre com uma conta ADMIN.</p><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" type="submit">Entrar</button></form><div class="separator"><span>ou continue com</span></div><div id="google-button" aria-label="Continuar com Google"></div><p id="login-status" role="alert" aria-live="polite"></p></section><section id="admin-view" hidden><header><div><h1>Administração</h1><p>Catálogo seguro de avatares e cenários.</p></div><button id="logout" type="button">Sair</button></header><section class="cards" id="dashboard" aria-live="polite"></section><nav><button data-view="avatars" type="button">Avatares</button><button data-view="scenarios" type="button">Cenários</button><button data-view="users" type="button" id="users-nav" hidden>Usuários</button></nav><section id="content"></section><p id="status" role="status" aria-live="polite"></p></section></main><script src="app.js"></script></body></html>
